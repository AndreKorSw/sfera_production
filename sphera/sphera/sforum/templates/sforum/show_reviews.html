{% extends "sforum/base.html" %}
{% load static %}
{% load sforum_tags %}

{% block content %}
<main class="main">

<section class="events">
			<div class="container">
				<h1 class="sp-title">ПОСЛЕДНИЕ СОБЫТИЯ</h1>
				<div class="slider-container">
    <div class="slider-wrapper">
		{% for event in events %}
      <div class="card1">
        <a class="new__photo-link" href="{{ event.get_absolute_url }}"><img src="{{ event.photo.url }}" alt="Изображение 1"></a>
		<a class="new__photo-link" href="{{ event.get_absolute_url }}"><h2>{{ event.title }}</h2></a>
		<div class="card1_container">

          <div class="city-buttons">

			  <button onclick="shareContent('{{ event.get_absolute_url }}')">
                        Поделиться

			  </button>
          </div>
			</div>
                </div>
		{% endfor %}
    </div>

    <button class="slider-button slider-button-prev">&#10094;</button>
    <button class="slider-button slider-button-next">&#10095;</button>
  </div>
				<br>


				<h1 class="sp-title" style="font-size:36px;">EVENTS IN MSK</h1>
				<div class="button-container">
					<a href="{% url 'show_reviews_for_life' %}">FOR LIFE</a>
					<div class="divider"></div>
					<a href="{% url 'show_reviews_fire_fun' %}">FIRE FUN</a>
				</div>
				<br>
		<div class="container4">
			{% for n in reviews %}
			<div class="card4">
			 <a href="{{ n.get_absolute_url }}"><img src="{{ n.photo.url }}" alt=""></a>
			  <div class="card-content4">
				<div class="card-title4"><a href="{{ n.get_absolute_url }}">{{ n.title }}</a></div>
			  </div>
			</div>
			{% endfor %}
	  	</div>

			</div>

		</section>
	<script src="{% static 'sforum/js/script4.js' %}" type=""></script>
</main>

{% endblock %}
